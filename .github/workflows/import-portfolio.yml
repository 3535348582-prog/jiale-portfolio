name: Import portfolio source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-portfolio-source
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify parts and safely extract source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, re, stat, zipfile
          root = Path.cwd().resolve()
          manifest_path = root/'portfolio-upload.json'
          if not manifest_path.is_file():
              raise SystemExit('No upload manifest exists. This one-time import has already run, or the upload is incomplete.')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['format'] == 1
          parts = manifest['parts']
          assert 1 <= len(parts) <= 64
          names = [item['name'] for item in parts]
          assert names == [f'portfolio-upload.part{i:03d}' for i in range(1,len(parts)+1)]
          assert sorted(p.name for p in root.glob('portfolio-upload.part*')) == names, 'Unexpected or missing upload part'
          archive = Path(os.environ['RUNNER_TEMP'])/'portfolio-source.zip'
          archive_digest = hashlib.sha256()
          total = 0
          with archive.open('wb') as output:
              for item in parts:
                  source = root/item['name']
                  assert source.parent == root and not source.is_symlink()
                  chunk = source.read_bytes()
                  assert 0 < len(chunk) <= 20*1024*1024 and len(chunk) == item['bytes']
                  assert hashlib.sha256(chunk).hexdigest() == item['sha256'], item['name']
                  output.write(chunk); archive_digest.update(chunk); total += len(chunk)
          assert total == manifest['archive_bytes']
          assert archive_digest.hexdigest() == manifest['archive_sha256']
          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              assert len(entries) == manifest['files'] and len(entries) < 2000
              assert sum(entry.file_size for entry in entries) == manifest['uncompressed_bytes']
              assert sum(entry.file_size for entry in entries) < 1024*1024*1024
              seen = set()
              for entry in entries:
                  name = entry.filename
                  relative = PurePosixPath(name)
                  assert name and chr(92) not in name and not relative.is_absolute()
                  assert all(part not in ('', '.', '..', '.git', 'dist', 'outputs', '__pycache__') for part in relative.parts)
                  assert relative.parts[:2] != ('.github','workflows'), 'Workflows must be installed through the web editor'
                  assert name not in seen and not stat.S_ISLNK(entry.external_attr >> 16)
                  assert entry.file_size < 25*1024*1024
                  destination = root.joinpath(*relative.parts)
                  assert root in destination.resolve().parents
                  assert not destination.is_symlink()
                  seen.add(name)
              assert {'template.html','build_portfolio.py','README.md','.gitignore'}.issubset(seen)
              assert (root/'.github/workflows/build.yml').is_file(), 'Add the normal build.yml workflow through the web editor before importing'
              assert z.testzip() is None, 'ZIP integrity check failed'
              for entry in entries:
                  destination = root.joinpath(*PurePosixPath(entry.filename).parts)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(z.read(entry))
          # Removals are committed only after the build step has succeeded.
          for name in names: (root/name).unlink()
          manifest_path.unlink()
          print(f'Verified and extracted {len(entries)} source files from {len(parts)} parts.')
          PY

      - name: Build before committing imported files
        run: python build_portfolio.py

      - name: Commit verified source and remove temporary upload parts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git ls-files --cached dist | grep -q .; then
            echo "Refusing to commit generated dist files."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No source changes to import."
          else
            git commit -m "Import verified portfolio source and assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Save the verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist
