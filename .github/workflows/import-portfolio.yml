name: Import portfolio source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-portfolio-source
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the approved source and safely extract it
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, stat, urllib.request, zipfile
          root = Path.cwd().resolve()
          expected_sha = 'cb7088268a7143760cb2144c4f2ba29563efc56c4465e855f7e3c25cf2f7d978'
          source_url = 'https://jiale-shen-portfolio.surge.sh/portfolio-source.zip'
          manifest_url = 'https://jiale-shen-portfolio.surge.sh/portfolio-source.json'
          request = urllib.request.Request(manifest_url, headers={'Cache-Control':'no-cache','User-Agent':'portfolio-source-import'})
          with urllib.request.urlopen(request, timeout=60) as response:
              raw_manifest = response.read(262145)
          assert len(raw_manifest) <= 262144, 'Manifest is unexpectedly large'
          manifest = json.loads(raw_manifest)
          assert manifest['format'] == 1
          assert manifest['archive_sha256'] == expected_sha, 'Manifest does not describe the approved source'
          assert manifest['files'] == 140
          assert 0 < manifest['archive_bytes'] < 1024*1024*1024
          archive = Path(os.environ['RUNNER_TEMP'])/'portfolio-source.zip'
          archive_digest = hashlib.sha256()
          total = 0
          request = urllib.request.Request(source_url, headers={'Cache-Control':'no-cache','User-Agent':'portfolio-source-import'})
          with urllib.request.urlopen(request, timeout=120) as response, archive.open('wb') as output:
              while chunk := response.read(1024*1024):
                  output.write(chunk); archive_digest.update(chunk); total += len(chunk)
                  assert total <= manifest['archive_bytes'], 'Source download exceeds the approved size'
          assert total == manifest['archive_bytes']
          assert archive_digest.hexdigest() == expected_sha, 'Source checksum mismatch'
          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              assert len(entries) == manifest['files'] == 140
              assert sum(entry.file_size for entry in entries) == manifest['uncompressed_bytes']
              assert sum(entry.file_size for entry in entries) < 1024*1024*1024
              seen = set()
              for entry in entries:
                  name = entry.filename
                  relative = PurePosixPath(name)
                  assert name and chr(92) not in name and not relative.is_absolute()
                  assert all(part not in ('', '.', '..', '.git', 'dist', 'outputs', '__pycache__') for part in relative.parts)
                  assert relative.parts[:2] != ('.github','workflows'), 'Workflows must be installed through the web editor'
                  assert name not in seen and not stat.S_ISLNK(entry.external_attr >> 16)
                  assert entry.file_size < 25*1024*1024
                  destination = root.joinpath(*relative.parts)
                  assert root in destination.resolve().parents
                  assert not destination.is_symlink()
                  seen.add(name)
              assert {'template.html','build_portfolio.py','README.md','.gitignore'}.issubset(seen)
              assert (root/'.github/workflows/build.yml').is_file(), 'Add the normal build.yml workflow through the web editor before importing'
              assert z.testzip() is None, 'ZIP integrity check failed'
              for entry in entries:
                  destination = root.joinpath(*PurePosixPath(entry.filename).parts)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(z.read(entry))
          # Removals are committed only after the build step has succeeded.
          for old_part in root.glob('portfolio-upload.part[0-9][0-9][0-9]'):
              if old_part.is_file(): old_part.unlink()
          old_manifest = root/'portfolio-upload.json'
          if old_manifest.is_file(): old_manifest.unlink()
          print(f'Downloaded the approved ZIP and extracted {len(entries)} source files.')
          PY

      - name: Build before committing imported files
        run: python build_portfolio.py

      - name: Commit verified source and remove temporary upload parts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git ls-files --cached dist | grep -q .; then
            echo "Refusing to commit generated dist files."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No source changes to import."
          else
            git commit -m "Import verified portfolio source and assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Save the verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist
