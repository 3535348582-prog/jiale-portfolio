name: Update FEINT and heritage videos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/media-update-20261128.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-video-media-update
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the approved source and media snapshot
        env:
          EXPECTED_ARCHIVE_SHA: b454a6a916ec3b39c3d8f4207e7195a88545f4b260380b036d36bd1601d5fdb8
          EXPECTED_ARCHIVE_BYTES: '821812'
        run: |
          python - <<'PY'
          import hashlib,io,json,os,stat,urllib.request,zipfile
          from pathlib import Path,PurePosixPath
          approved={'template.html': {'bytes': 1727902, 'sha256': 'd1bf8d3010c13f1b6435873bc18cedec1aefe24028d37e26a668833732e05a83'}, '_deck_feature.js': {'bytes': 15338, 'sha256': 'e992e1a32d60c90bef680d4329dfb9b68b35295eda7278483cec05dd044bc887'}}
          url='https://jiale-shen-portfolio.surge.sh/portfolio-copy-update-20261128.zip'
          with urllib.request.urlopen(url,timeout=90) as response:
              data=response.read(64*1024*1024+1)
          assert len(data)==int(os.environ['EXPECTED_ARCHIVE_BYTES'])
          assert hashlib.sha256(data).hexdigest()==os.environ['EXPECTED_ARCHIVE_SHA']
          root=Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              entries=archive.infolist()
              assert len(entries)==len(approved) and len({e.filename for e in entries})==len(entries)
              assert {e.filename for e in entries}==set(approved)
              contents={}
              for e in entries:
                  p=PurePosixPath(e.filename)
                  assert not p.is_absolute() and not any(x in ('..','.','') for x in p.parts)
                  assert not e.is_dir() and not stat.S_ISLNK(e.external_attr>>16)
                  assert e.file_size==approved[e.filename]['bytes'] and e.file_size<100*1024*1024
                  dest=root.joinpath(*p.parts)
                  assert root in dest.resolve().parents and not dest.is_symlink()
                  assert not any(parent.is_symlink() for parent in dest.parents if root in parent.parents)
                  content=archive.read(e)
                  assert hashlib.sha256(content).hexdigest()==approved[e.filename]['sha256']
                  contents[e.filename]=content
              for name,content in contents.items():
                  dest=root/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(content)
          (Path(os.environ['RUNNER_TEMP'])/'approved-video-paths.json').write_text(json.dumps(sorted(approved)))
          print('Verified and applied',len(approved),'approved files.')
          PY
      - name: Build the complete portfolio
        run: python build_portfolio.py
      - name: Commit only the approved changes
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          paths=json.loads((Path(os.environ['RUNNER_TEMP'])/'approved-video-paths.json').read_text())
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split(chr(0))
          assert set(filter(None,staged)).issubset(paths)
          result=subprocess.run(['git','diff','--cached','--quiet'])
          assert result.returncode in (0,1)
          if result.returncode:
              subprocess.run(['git','commit','-m','Replace BOX with FEINT 4K film and smooth heritage introduction'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist
