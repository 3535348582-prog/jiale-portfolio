<section id="guestbook" class="section guestbook-section" aria-labelledby="guestbookTitle">
  <div class="wrap">
    <div class="guestbook-heading">
      <div class="eyebrow">STAR NOTES / <span data-gb-key="eyebrow">星际留言簿</span></div>
      <h2 id="guestbookTitle" data-gb-key="title">在这片星空，留下你的想法。</h2>
      <p data-gb-key="intro">哪件作品让你停留？哪个细节可以更好？欢迎留言，也欢迎回复彼此。</p>
    </div>
    <div class="guestbook-shell">
      <details class="guestbook-identity" id="guestbookIdentity">
        <summary><span data-gb-key="choose">为留言选一个星座图标</span><small data-gb-key="optional">可选</small></summary>
        <div class="guestbook-identity-body">
          <div class="guestbook-badge-preview" id="guestbookBadge" aria-live="polite"></div>
          <div class="guestbook-star-controls">
            <label for="guestbookZodiac" data-gb-key="yourStar">你的星座</label>
            <select id="guestbookZodiac"><option value="" data-gb-key="selectPrompt">选择一个喜欢的星座</option></select>
            <p class="guestbook-quiet" data-gb-key="identityHelp">星座图标会自动随留言显示。未选择时会随机分配，也能随时更换。</p>
            <div class="guestbook-actions"><button type="button" id="guestbookSuggest" data-gb-key="suggest">帮我选一个</button></div>
            <p id="guestbookIdentityStatus" class="guestbook-quiet" role="status"></p>
          </div>
        </div>
      </details>
      <div class="anonymous-comments" id="anonymousComments" aria-label="公开留言与回复">
        <p class="anc-intro" data-anc-key="intro">无需注册，填写昵称就能留言。昵称和星座会随留言公开显示。</p>
        <form id="anonymousCommentForm" class="anc-form">
          <div class="anc-fields"><div class="anc-name-field"><label for="anonymousNickname"><span data-anc-key="nickname">访客昵称（可选）</span></label><div class="anc-nickname-controls"><input id="anonymousNickname" name="nickname" maxlength="24" autocomplete="off" placeholder="" aria-describedby="anonymousIdentityStatus"><button type="button" id="anonymousIdentitySave">保存发言信息</button></div><p id="anonymousIdentityStatus" class="anc-identity-status" role="status">填写昵称并选择星座后可保存。</p></div><span class="anc-counter" id="anonymousCommentCount" aria-live="off">0 / 1000</span></div>
          <div class="anc-replying" id="anonymousReplying" hidden><span id="anonymousReplyTarget"></span><button type="button" id="anonymousCancelReply" data-anc-key="cancelReply">取消回复</button></div>
          <label class="anc-sr-only" for="anonymousCommentBody" data-anc-key="bodyLabel">留言内容</label>
          <textarea id="anonymousCommentBody" name="body" maxlength="1000" rows="4" required placeholder="留下你的想法，也可以输入 @ 提及其他访客。" aria-describedby="anonymousCommentStatus" aria-controls="anonymousMentionList" aria-autocomplete="list"></textarea>
          <div id="anonymousMentionList" class="anc-mentions" role="listbox" aria-label="提及访客" hidden></div>
          <div class="anc-trap" aria-hidden="true"><label>Website<input id="anonymousWebsite" name="website" tabindex="-1" autocomplete="off"></label></div>
          <div class="anc-submit-row"><span id="anonymousCommentStatus" class="anc-status" role="status"></span><button type="submit" id="anonymousCommentSubmit" data-anc-key="send">发送留言</button></div>
        </form>
        <div class="anc-list-heading"><h3 id="anonymousListTitle" data-anc-key="listTitle">星际留言</h3><button type="button" id="anonymousCommentRefresh" data-anc-key="refresh">刷新留言</button></div>
        <div id="anonymousCommentFeed" class="anc-feed" aria-live="polite" aria-busy="false"></div>
        <button type="button" id="anonymousCommentMore" class="anc-more" data-anc-key="more" hidden>查看更多留言</button>
      </div>
      <noscript><p>请启用 JavaScript 以查看和发表公开留言。 / Enable JavaScript to read and post public comments.</p></noscript>
    </div>
  </div>
</section>
